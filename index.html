<!DOCTYPE html>
<html>
<head>
    <title>글로벌 Top 시총 배당금 대시보드</title>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; text-align: center; padding: 30px; }
        h1 { color: #333; }
        .main-wrapper { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; margin-top: 30px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .list-section { display: flex; gap: 20px; }
        .market-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; }
        .market-box h2 { color: #0056b3; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .stock-list { list-style: none; padding: 0; }
        .stock-list li { margin: 10px 0; }
        .stock-list button { width: 100%; display: block; border: none; cursor: pointer; color: #333; background: #e9ecef; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.2s; font-size: 15px; }
        .stock-list button:hover { background: #0056b3; color: white; transform: scale(1.02); }
        .result-box { background: #fff8e1; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; text-align: left; border: 2px solid #ffc107; }
        .result-box h2 { color: #d84315; font-size: 20px; margin-top: 0; border-bottom: 2px dashed #ffc107; padding-bottom: 10px; }
        .result-content { font-size: 16px; line-height: 1.6; }
        .result-content ul { padding-left: 20px; }
        .result-content li { margin-bottom: 8px; }
        .loading { color: #666; font-style: italic; text-align: center; margin-top: 50px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let myChart = null;

        async function fetchDividend(ticker, name) {
            const contentDiv = document.getElementById('result-content');
            const titleDiv = document.getElementById('result-title');

            titleDiv.innerText = `${name} 조회 중... 🔍`;
            contentDiv.innerHTML = '<div class="loading">⏳ 데이터를 가져오는 중입니다...</div>';

            try {
                const response = await fetch('/dividend/' + ticker);
                const result = await response.json();
                
                const data = result.data;
                const currentPrice = result.current_price;
                const newsData = result.news; // 👈 서버에서 뉴스 데이터 받기

                titleDiv.innerText = `✅ ${name} (${ticker})`;

                if (Object.keys(data).length === 0) {
                    contentDiv.innerHTML = '<p style="text-align:center; margin-top:30px;">😢 최근 배당금 내역이 없습니다.</p>';
                    return;
                }

                let html = '';
                const currency = ticker.includes('.KS') ? '₩' : '$';

                // 1. 주가 및 배당률
                if (currentPrice > 0) {
                    const amounts = Object.values(data);
                    const latestDividend = amounts[amounts.length - 1];
                    const yieldPct = ((latestDividend / currentPrice) * 100).toFixed(2);
                    
                    html += `<div style="background-color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #eee;">
                                <span style="font-size: 16px; color: #555;">현재 주가: <b>${currency}${currentPrice.toLocaleString('en-US', {maximumFractionDigits: 2})}</b></span><br>
                                <span style="color: #d84315; font-size: 18px; font-weight: bold;">📈 1회 지급액 기준 배당률: 약 ${yieldPct}%</span>
                             </div>`;
                }

                // 2. 배당금 내역 리스트
                html += '<ul>';
                for (const [dateString, amount] of Object.entries(data)) {
                    const shortDate = dateString.split(' ')[0];
                    html += `<li>📅 <b>${shortDate}</b> : 💰 ${currency}${amount.toFixed(2)}</li>`;
                }
                html += '</ul>';

                html += `<div style="margin-top: 20px; padding-top: 15px; border-top: 2px dashed #ffc107;">
                            <h3 style="color: #333; font-size: 16px; margin-bottom: 10px;">📊 최근 배당금 추이</h3>
                            <canvas id="dividendChart"></canvas>
                         </div>`;

                // 만들어진 HTML을 화면에 꽂아 넣습니다.
                contentDiv.innerHTML = html;

                // 👇 [여기 추가 3] 이제 캔버스 위에 진짜 막대그래프를 그립니다!
                const ctx = document.getElementById('dividendChart').getContext('2d');

                // 중요: 다른 종목을 눌렀을 때 그래프가 겹치는 것을 막기 위해 기존 그래프를 파괴합니다.
                if (myChart !== null) {
                    myChart.destroy();
                }

                // X축(날짜)과 Y축(배당금액) 데이터를 준비합니다.
                const labels = Object.keys(data).map(date => date.split(' ')[0]);
                const chartData = Object.values(data);

                myChart = new Chart(ctx, {
                    type: 'bar', // 막대그래프 모양
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `배당금 (${currency})`,
                            data: chartData,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)', // 시원한 파란색
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1,
                            borderRadius: 4 // 막대 모서리를 살짝 둥글게!
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { 
                                // 배당금 변화가 드라마틱하게 보이도록 0부터 시작하지 않게 설정
                                beginAtZero: false 
                            } 
                        }
                    }
                });

            } catch (error) {
                titleDiv.innerText = '❌ 통신 오류';
                contentDiv.innerHTML = '<p>데이터를 불러오는데 실패했습니다.</p>';
            }
        }
    </script>
</head>
<body>
    <h1>📊 글로벌 Top 10 배당금 대시보드</h1>
    <p>궁금한 종목을 클릭하면 화면 이동 없이 오른쪽에서 바로 내역을 분석해 드립니다.</p>
    
    <div class="main-wrapper">
        <div class="list-section">
            <!-- 미국 주식 리스트 (파이썬이 하던 걸 HTML에 고정해 두었습니다) -->
            <div class="market-box">
                <h2>🇺🇸 미국 주식 (US Tech)</h2>
                <ul class="stock-list">
                    <li><button onclick="fetchDividend('AAPL', '애플')">애플</button></li>
                    <li><button onclick="fetchDividend('MSFT', '마이크로소프트')">마이크로소프트</button></li>
                    <li><button onclick="fetchDividend('NVDA', '엔비디아')">엔비디아</button></li>
                    <li><button onclick="fetchDividend('GOOGL', '알파벳(구글)')">알파벳(구글)</button></li>
                    <li><button onclick="fetchDividend('TSLA', '테슬라')">테슬라</button></li>
                </ul>
            </div>
            <!-- 한국 주식 리스트 -->
            <div class="market-box">
                <h2>🇰🇷 한국 주식 (KOSPI)</h2>
                <ul class="stock-list">
                    <li><button onclick="fetchDividend('005930.KS', '삼성전자')">삼성전자</button></li>
                    <li><button onclick="fetchDividend('000660.KS', 'SK하이닉스')">SK하이닉스</button></li>
                    <li><button onclick="fetchDividend('000270.KS', '기아')">기아</button></li>
                    <li><button onclick="fetchDividend('035420.KS', 'NAVER')">NAVER</button></li>
                    <li><button onclick="fetchDividend('373220.KS', 'LG에너지솔루션')">LG에너지솔루션</button></li>
                </ul>
            </div>
        </div>

        <div class="result-box">
            <h2 id="result-title">👉 종목을 선택해 주세요</h2>
            <div id="result-content" class="result-content">
                <p style="text-align: center; margin-top: 50px; color: #888;">좌측 리스트에서 버튼을 클릭하면<br>이곳에 배당금 정보가 나타납니다.</p>
            </div>
        </div>
    </div>
</body>
</html>
